<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#10231c" />
    <meta name="description" content="Roots of Renewal — guerra territorial procedural" />
    <title>Roots of Renewal</title>
  </head>
  <body>
    <div id="rotate"><div class="rotate-icon">↻</div><strong>Gire o aparelho</strong><span>Roots of Renewal funciona na horizontal.</span></div>
    <main id="app">
      <canvas id="game" aria-label="Campo de batalha"></canvas>
      <header id="topbar">
        <div class="brand"><span class="leaf">◆</span><b>ROOTS</b><small>OF RENEWAL</small></div>
        <div class="stat"><span>MOEDAS</span><b id="coins">0</b></div>
        <div class="stat"><span>RENDA</span><b id="income">+0/s</b></div>
        <div class="stat territory"><span>TERRITÓRIO</span><b id="territory">0%</b></div>
        <div class="stat"><span>TEMPO</span><b id="timer">00:00</b></div>
        <button id="centerBattle" class="icon-btn" title="Centralizar na batalha" aria-label="Centralizar na batalha">◎</button>
        <button id="soundToggle" class="icon-btn" title="Som" aria-label="Ativar ou desativar som">♪</button>
      </header>
      <section id="prepPanel" class="panel">
        <div><small>FASE DE PREPARAÇÃO</small><strong>Posicione seu destacamento</strong><p>Escolha uma tropa e toque na zona verde. O inimigo prepara-se em segredo.</p></div>
        <div class="prep-score"><span>PONTOS</span><b id="prepPoints">24</b></div>
        <button id="startBattle" class="primary">INICIAR BATALHA <span>▶</span></button>
      </section>
      <section id="selectionInfo" class="selection-info hidden"></section>
      <aside id="minimapWrap"><canvas id="minimap" width="160" height="240" aria-label="Minimapa"></canvas><span>MAPA TÁTICO</span><div id="zoomControls"><button id="zoomOut" aria-label="Afastar câmera">−</button><b id="zoomLabel">100%</b><button id="zoomIn" aria-label="Aproximar câmera">+</button></div></aside>
      <section id="bottomHud">
        <div id="cards" class="cards" aria-label="Cartas de tropas e construções"></div>
        <div id="orders" class="orders">
          <button data-order="advance" title="Avançar (Q)">▲<span>AVANÇAR</span></button>
          <button data-order="attack" title="Atacar (W)">⚔<span>ATACAR</span></button>
          <button data-order="defend" title="Defender (E)">⬡<span>DEFENDER</span></button>
          <button data-order="hold" title="Manter (R)">■<span>MANTER</span></button>
          <button data-order="return" title="Retornar (T)">▼<span>RETORNAR</span></button>
        </div>
      </section>
      <div id="toast" role="status"></div>
      <div id="result" class="modal hidden">
        <div class="result-card"><small>FIM DA BATALHA</small><h1 id="resultTitle">VITÓRIA</h1><p id="resultReason"></p><div id="resultStats" class="result-stats"></div><button id="restart" class="primary">JOGAR NOVAMENTE</button></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
